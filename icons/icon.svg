<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c161d" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FA243C" />
      <stop offset="100%" stop-color="#FF6B81" />
    </linearGradient>
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="4" />

  <!-- Outer Vinyl Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#roseGrad)" stroke-width="4" opacity="0.35" filter="url(#crimsonGlow)" />

  <!-- Vinyl Record Body -->
  <circle cx="256" cy="256" r="170" fill="#111116" stroke="rgba(255,255,255,0.06)" stroke-width="2" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.5" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.5" />

  <!-- Center Label -->
  <circle cx="256" cy="256" r="76" fill="url(#roseGrad)" filter="url(#crimsonGlow)" />
  <circle cx="256" cy="256" r="22" fill="#09090B" stroke="rgba(255,255,255,0.4)" stroke-width="2" />

  <!-- Waveform Pulse Accent Bars -->
  <g fill="#FFFFFF" opacity="0.95">
    <rect x="238" y="196" width="6" height="30" rx="3" />
    <rect x="248" y="184" width="6" height="54" rx="3" />
    <rect x="258" y="190" width="6" height="42" rx="3" />
    <rect x="268" y="202" width="6" height="18" rx="3" />
  </g>
</svg>

